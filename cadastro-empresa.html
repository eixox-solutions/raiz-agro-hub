<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa — Raiz Agro Hub</title>
    <meta name="description" content="Conte o que sua empresa resolve e a gente te conecta com produtores que precisam disso.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mvp.css">

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y6k3rd89ay");
    </script>
</head>
<body class="mvp-page">
    <div class="mvp-shell">
        <div class="mvp-topbar">
            <span class="mvp-logo">Raiz<span class="dot"></span></span>
            <a href="index.html" class="mvp-back-link"><i class="fa-solid fa-arrow-left"></i> Voltar para o site</a>
        </div>

        <div class="mvp-card">
            <span class="mvp-eyebrow"><i class="fa-solid fa-microchip"></i> Sou Empresa de Tecnologia</span>
            <h1 class="mvp-title">Conte o que sua empresa resolve e a gente te conecta com quem precisa</h1>
            <p class="mvp-subtitle">É rápido, é de graça, e você vai ser uma das primeiras empresas no Raiz.</p>

            <form id="formEmpresa" novalidate>
                <div class="mvp-form-row">
                    <div class="mvp-form-group">
                        <label for="nomeEmpresa">Nome da empresa <span class="mvp-required">*</span></label>
                        <input type="text" id="nomeEmpresa" name="nomeEmpresa" class="mvp-control" placeholder="Nome da sua empresa" required>
                    </div>
                    <div class="mvp-form-group">
                        <label for="responsavel">Responsável <span class="mvp-required">*</span></label>
                        <input type="text" id="responsavel" name="responsavel" class="mvp-control" placeholder="Seu nome" required>
                    </div>
                </div>

                <div class="mvp-form-row">
                    <div class="mvp-form-group">
                        <label for="email">E-mail <span class="mvp-required">*</span></label>
                        <input type="email" id="email" name="email" class="mvp-control" placeholder="contato@suaempresa.com" required>
                    </div>
                    <div class="mvp-form-group">
                        <label for="telefone">Telefone <span class="mvp-required">*</span></label>
                        <input type="tel" id="telefone" name="telefone" class="mvp-control" placeholder="(67) 99999-9999" required>
                    </div>
                </div>

                <div class="mvp-form-group">
                    <label for="uf">UF da sede <span class="mvp-required">*</span></label>
                    <select id="uf" name="uf" class="mvp-control" required>
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div class="mvp-form-group">
                    <label>Regiões atendidas <span class="mvp-required">*</span></label>
                    <div class="mvp-radio-group mvp-radio-group-2" id="regioesGroup">
                        <div class="mvp-radio-option">
                            <input type="radio" name="regioesAtendidas" id="regiao-estado" value="estado" required>
                            <label for="regiao-estado">Só no meu estado</label>
                        </div>
                        <div class="mvp-radio-option">
                            <input type="radio" name="regioesAtendidas" id="regiao-nacional" value="nacional" required>
                            <label for="regiao-nacional">Atendo o Brasil todo</label>
                        </div>
                    </div>
                </div>

                <div class="mvp-form-group">
                    <label for="categoriaSolucao">Categoria da solução <span class="mvp-required">*</span></label>
                    <select id="categoriaSolucao" name="categoriaSolucao" class="mvp-control" required>
                        <option value="">Selecione</option>
                    </select>
                    <span class="mvp-hint">Escolha o assunto que mais tem a ver com o que sua solução resolve.</span>
                </div>

                <div class="mvp-form-group">
                    <label for="descSolucao">Descrição da solução</label>
                    <textarea id="descSolucao" name="descSolucao" class="mvp-control" placeholder="Conte em poucas palavras o que sua empresa resolve..."></textarea>
                </div>

                <div class="mvp-form-group">
                    <label for="estagio">Estágio da solução <span class="mvp-required">*</span></label>
                    <select id="estagio" name="estagio" class="mvp-control" required>
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div class="mvp-form-group">
                    <label for="porteAlvo">Pra qual tamanho de propriedade sua solução é melhor? <span class="mvp-required">*</span></label>
                    <select id="porteAlvo" name="porteAlvo" class="mvp-control" required>
                        <option value="">Selecione</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-lg mvp-submit">
                    Enviar meu Cadastro <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="mvp-data.js"></script>
    <script src="mvp-mask.js"></script>
    <script>
        (function () {
            var ESTAGIO_LABELS = {
                ideacao: 'Ainda é uma ideia',
                prototipo: 'Já temos um protótipo',
                teste: 'Em teste com produtores',
                validado: 'Já validamos com produtores',
                operacao: 'Já vendemos/operamos'
            };

            function preencherSelect(select, opcoes, formatarLabel) {
                opcoes.forEach(function (valor) {
                    var option = document.createElement('option');
                    option.value = valor;
                    option.textContent = formatarLabel ? formatarLabel(valor) : valor;
                    select.appendChild(option);
                });
            }

            mvpAplicarMascaraTelefone(document.getElementById('telefone'));

            preencherSelect(document.getElementById('uf'), MVP_ESTADOS, function (uf) {
                return uf === 'OUTRO' ? 'Outro Estado' : uf;
            });
            preencherSelect(document.getElementById('categoriaSolucao'), MVP_CATEGORIAS);
            preencherSelect(document.getElementById('estagio'), MVP_ESTAGIOS, function (valor) {
                return ESTAGIO_LABELS[valor] || valor;
            });
            preencherSelect(document.getElementById('porteAlvo'), MVP_PORTES);

            var form = document.getElementById('formEmpresa');
            form.addEventListener('submit', function (event) {
                event.preventDefault();

                var regiaoEl = form.querySelector('input[name="regioesAtendidas"]:checked');

                var dados = {
                    nomeEmpresa: document.getElementById('nomeEmpresa').value.trim(),
                    responsavel: document.getElementById('responsavel').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    telefone: document.getElementById('telefone').value.trim(),
                    uf: document.getElementById('uf').value,
                    regioesAtendidas: regiaoEl ? regiaoEl.value : '',
                    categoriaSolucao: document.getElementById('categoriaSolucao').value,
                    descSolucao: document.getElementById('descSolucao').value.trim(),
                    estagio: document.getElementById('estagio').value,
                    porteAlvo: document.getElementById('porteAlvo').value
                };

                if (!form.checkValidity() || !dados.regioesAtendidas) {
                    form.reportValidity();
                    return;
                }

                var empresa = mvpSalvarEmpresa(dados);
                window.location.href = 'matches.html?tipo=empresa&id=' + empresa.id;
            });
        })();
    </script>
</body>
</html>
